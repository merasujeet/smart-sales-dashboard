<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Team Member</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
        }

        .container {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e293b;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .cancel {
            flex: 1;
            background: #64748b;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel:hover {
            background: #475569;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>✏️ Edit Team Member</h2>

    <form method="POST">

        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ member.name }}"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ member.email }}"
            required
        >

        <label>Phone</label>
        <input
            type="text"
            name="phone"
            value="{{ member.phone }}"
        >

        <label>Role</label>

        <select name="role" required>

            <option value="Sales Executive"
                {% if member.role == "Sales Executive" %}selected{% endif %}>
                Sales Executive
            </option>

            <option value="Marketing Manager"
                {% if member.role == "Marketing Manager" %}selected{% endif %}>
                Marketing Manager
            </option>

            <option value="Data Analyst"
                {% if member.role == "Data Analyst" %}selected{% endif %}>
                Data Analyst
            </option>

            <option value="Team Leader"
                {% if member.role == "Team Leader" %}selected{% endif %}>
                Team Leader
            </option>

            <option value="Developer"
                {% if member.role == "Developer" %}selected{% endif %}>
                Developer
            </option>

        </select>

        <label>Status</label>

        <select name="status" required>

            <option value="Active"
                {% if member.status == "Active" %}selected{% endif %}>
                Active
            </option>

            <option value="Inactive"
                {% if member.status == "Inactive" %}selected{% endif %}>
                Inactive
            </option>

        </select>

        <div class="buttons">

            <button type="submit">
                💾 Save Changes
            </button>

            <a href="{{ url_for('team_page') }}" class="cancel">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
