<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - Smart Sales Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* STOCK FIELD */
        .stock-input {
            border: 2px solid #2563eb;
            background: #eff6ff;
            font-weight: bold;
        }

        .stock-help {
            margin-top: 6px;
            font-size: 13px;
            color: #666;
        }

        /* PROFIT BOX */
        .profit-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
        }

        .profit-box p {
            margin: 7px 0;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .update-btn {
            flex: 1;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            flex: 1;
            padding: 13px;
            background: #e5e7eb;
            color: #222;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <h1>✏️ Edit Product</h1>

        <p class="subtitle">
            Update product information
        </p>

        <form
            action="{{ url_for('edit_product', product_id=product.id) }}"
            method="POST"
        >

            <!-- PRODUCT NAME -->
            <div class="form-group">

                <label>Product Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ product.name }}"
                    required
                >

            </div>


            <!-- CATEGORY -->
            <div class="form-group">

                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    value="{{ product.category }}"
                    required
                >

            </div>


            <!-- COST PRICE -->
            <div class="form-group">

                <label>Cost Price (₹)</label>

                <input
                    type="number"
                    name="cost_price"
                    id="cost_price"
                    value="{{ product.cost_price }}"
                    step="0.01"
                    min="0"
                    required
                    oninput="calculateProfit()"
                >

            </div>


            <!-- SELLING PRICE -->
            <div class="form-group">

                <label>Selling Price (₹)</label>

                <input
                    type="number"
                    name="price"
                    id="price"
                    value="{{ product.price }}"
                    step="0.01"
                    min="0"
                    required
                    oninput="calculateProfit()"
                >

            </div>


            <!-- STOCK -->
            <div class="form-group">

                <label>Stock Quantity</label>

                <input
                    type="number"
                    name="stock"
                    id="stock"
                    value="{{ product.stock }}"
                    min="0"
                    step="1"
                    required
                    class="stock-input"
                    oninput="calculateProfit()"
                >

                <p class="stock-help">
                    Enter the current available stock quantity.
                </p>

            </div>


            <!-- PROFIT CALCULATION -->
            <div class="profit-box">

                <p>
                    <strong>Profit Per Unit:</strong>
                    ₹<span id="unitProfit">0.00</span>
                </p>

                <p>
                    <strong>Margin:</strong>
                    <span id="marginPercent">0.00</span>%
                </p>

                <p>
                    <strong>Total Stock Profit:</strong>
                    ₹<span id="totalProfit">0.00</span>
                </p>

            </div>


            <!-- BUTTONS -->
            <div class="buttons">

                <button
                    type="submit"
                    class="update-btn"
                >
                    💾 Update Product
                </button>

                <a
                    href="{{ url_for('products_page') }}"
                    class="back-btn"
                >
                    Back
                </a>

            </div>

        </form>

    </div>

</div>


<script>

function calculateProfit() {

    let cost =
        parseFloat(document.getElementById("cost_price").value) || 0;

    let price =
        parseFloat(document.getElementById("price").value) || 0;

    let stock =
        parseInt(document.getElementById("stock").value) || 0;

    // Profit per unit
    let profit = price - cost;

    // Margin percentage
    let margin = 0;

    if (price > 0) {
        margin = (profit / price) * 100;
    }

    // Total profit
    let totalProfit = profit * stock;

    // Display values
    document.getElementById("unitProfit").innerText =
        profit.toFixed(2);

    document.getElementById("marginPercent").innerText =
        margin.toFixed(2);

    document.getElementById("totalProfit").innerText =
        totalProfit.toFixed(2);
}


// Calculate when page opens
calculateProfit();

</script>

</body>

</html>
